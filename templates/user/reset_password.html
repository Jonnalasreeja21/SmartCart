<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SmartCart</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #25205b, #5142bd); }
        .card { width: 100%; max-width: 420px; padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.2); }
        h1 { margin: 0 0 10px; color: #30266f; text-align: center; }
        p { color: #666; line-height: 1.5; text-align: center; }
        label { display: block; margin: 18px 0 8px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; color: white; background: #5142bd; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #392d91; }
        .message { margin: 12px 0; padding: 10px; border-radius: 7px; background: #f1efff; color: #30266f; }
        .back { display: block; margin-top: 20px; color: #5142bd; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create New Password</h1>
        <p>Choose a password with at least 8 characters.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('user_reset_password', token=token) }}">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>

            <button type="submit">Reset Password</button>
        </form>

        <a class="back" href="{{ url_for('user_login') }}">Back to User Login</a>
    </main>
</body>
</html>
