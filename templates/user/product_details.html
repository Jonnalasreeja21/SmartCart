{% extends "user/base.html" %}

{% block title %}Product Details | SmartCart{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card p-4">
        <div class="row align-items-center">

            <div class="col-md-5">
                <img class="product-detail-image"
                     src="{{ url_for('static', filename='uploads/product_images/' ~ product.image) }}"
                     alt="{{ product.name }}">
            </div>

            <div class="col-md-7">
                <h2>{{ product.name }}</h2>

                <p><strong>Description:</strong> {{ product.description }}</p>
                <p><strong>Category:</strong> {{ product.category }}</p>

                <h3 class="text-success">₹{{ product.price }}</h3>

                <a href="{{ url_for('add_to_cart', product_id=product.product_id) }}"
                   class="btn btn-primary">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </a>

                <a href="{{ url_for('user_products') }}"
                   class="btn btn-outline-primary">
                    Back to Products
                </a>
            </div>

        </div>
    </div>

</div>
{% endblock %}
