
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | SmartCart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .add-product-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #312e81;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        input:focus, textarea:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            background: #f8f7ff;
            cursor: pointer;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #3730a3, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            color: #312e81;
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
        }

        .alert.error, .alert.danger {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            .add-product-container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="add-product-container">

        <h2>🛍️ Add New Product</h2>
        <p class="subtitle">Add a new product to your SmartCart store.</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('add_item') }}"
              enctype="multipart/form-data">

            <label>Product Name:</label>
            <input type="text" name="name"
                   placeholder="Enter product name" required>

            <label>Description:</label>
            <textarea name="description"
                      placeholder="Enter product description"
                      required></textarea>

            <label>Category:</label>
            <input type="text" name="category"
                   placeholder="Enter category" required>

            <label>Price (₹):</label>
            <input type="number" step="0.01" min="0.01"
                   name="price" placeholder="Enter price" required>

            <label>Product Image:</label>
            <input type="file" name="image"
                   accept="image/*" required>

            <button type="submit">+ Add Product</button>

        </form>

        <a href="{{ url_for('admin_dashboard') }}"
           class="back-link">← Back to Dashboard</a>

    </div>

</body>
</html>
