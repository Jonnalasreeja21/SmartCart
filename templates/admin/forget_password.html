{% extends "admin/base.html" %}

{% block title %}SmartCart | Forgot Password{% endblock %}

{% block auth_content %}

<div class="auth-page">
    <div class="auth-card">

        <h2>SmartCart</h2>

        <h3>Forgot Password?</h3>

        <p>Don't worry! Enter your registered email address to reset your password.</p>

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <label for="email">Email Address</label><br><br>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your registered email"
                required
            >

            <br><br>

            <button type="submit" class="btn btn-primary w-100">
                Send Reset Link
            </button>

        </form>

        <br>

        <a href="{{ url_for('admin_login') }}">Back to Login</a>

    </div>
</div>

{% endblock %}
